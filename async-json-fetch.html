<!DOCTYPE html>
<html>
<head>
    <title>Intelligent Backend Service</title>
</head>
<body>

    <h2>Sensor Dashboard</h2>
    <div id="output">Loading data...</div>
    <div id="error"></div>

    <script>
        async function fetchData() {
            const output = document.getElementById("output");
            const error = document.getElementById("error");

            try {
                // Simulate an HTTP response containing JSON
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/todos/1"
                );

                // Check for HTTP errors
                if (!response.ok) {
                    throw new Error("HTTP Error: " + response.status);
                }

                // Parse JSON response
                const data = await response.json();

                // Update the DOM
                output.innerHTML = `
                    <h3>Backend Response</h3>
                    <p>ID: ${data.id}</p>
                    <p>Task: ${data.title}</p>
                    <p>Status: ${data.completed ? "Completed" : "Pending"}</p>
                `;

                error.textContent = "";

            } catch (err) {
                // Handle network and parsing errors
                output.textContent = "Unable to load data.";
                error.textContent = "Error: " + err.message;
                error.style.color = "red";
            }
        }

        fetchData();
    </script>

</body>
</html>
